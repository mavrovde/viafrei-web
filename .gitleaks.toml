# gitleaks configuration (the Security workflow's "Secrets in history (gitleaks)" job, gitleaks v8.30.1).
#
# The default rules, every one of them, plus ONE narrow exception. Nothing here turns a rule off: the exception
# is scoped to one rule, three test files and one literal shape, and all three conditions must hold (AND).
#
# Where it is read: on a pull request the job uses the BASE revision's copy of this file, so a pull request
# cannot widen the exception that judges it; the pull request's own copy is used only when the base has none
# (the bootstrap, before this file was on main). A path or a fingerprint in a `.gitleaksignore` is not used:
# the job refuses one, and a fingerprint names a commit sha that the squash merge changes anyway.

[extend]
useDefault = true

# The test keys of the IndexNow route and of the staging build: the sixteen hexadecimal digits in order (once or
# twice; the staging test starts the same run at `a`), written as a constant in a test so the route's answer can be
# compared. They are not keys of any service: a real IndexNow key is generated per host and lives only in the
# host's environment.
[[allowlists]]
description = "test literals: the hex alphabet in order, in the IndexNow and staging tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''^packages/web/test/indexnow\.test\.ts$''',
  '''^packages/web/e2e/indexnow\.e2e\.ts$''',
  '''^packages/web/test/staging-1235\.test\.ts$''',
]
regexes = ['''^(?:0123456789abcdef){1,2}$''', '''^abcdef0123456789$''']

# The sha256 of viafrei-api v0.3.0's published api/openapi.json (the SHA256SUMS line of that public release),
# written once into the generated client contract by commit f1e85be of pull request 37 under a field named
# openapiSha256, whose "api" the default rule reads as a key name. It is a public checksum, not a key; the field is
# now named contractSha256, which the rule does not match, so this literal in this one file is the only exception.
[[allowlists]]
description = "the public sha256 of viafrei-api v0.3.0's openapi.json in the generated client contract"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^packages/web/src/generated/api-operations\.ts$''']
regexes = ['''^ab6fb03352058ac3f9b8ac05709219c846f1c70635d0dadf620e587224b42911$''']
