# SonarCloud CI-based analysis (the scan runs in the CI workflow's sonar job; viafrei-api's shape).
sonar.organization=mavrovde
sonar.projectKey=mavrovde_viafrei-web
sonar.projectName=viafrei-web
sonar.host.url=https://sonarcloud.io

sonar.sources=packages,scripts
# Excluded from analysis, each for a reason:
#   tests, e2e               analysed as tests (sonar.test.inclusions), not as sources
#   src/generated            copies of viafrei's generated catalogue (docs/moved-from-viafrei.md)
#   the infra copy           viafrei-infra's files, byte for byte; findings belong there
#   fixtures                 planted corpora
sonar.exclusions=**/*.test.ts,**/*.e2e.ts,packages/web/test/**,packages/web/e2e/**,**/node_modules/**,**/dist/**,**/build/**,packages/web/src/generated/**,**,**/fixtures/**,packages/web/e2e/__screenshots__/**
sonar.tests=packages,test
sonar.test.inclusions=**/*.test.ts,**/*.e2e.ts,test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
