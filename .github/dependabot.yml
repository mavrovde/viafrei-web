# Monthly dependency updates, each as a pull request that runs the full CI.
# A version update waits 7 days after its release (cooldown), so a broken or
# malicious release has time to be found first; security updates are not delayed.
# Every pull request carries only the 'dependencies' label (the repo's label set
# is type:bug, type:feature, dependencies, documentation).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly # each update is a CI run, so once a month saves CI minutes
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      dev-tooling:
        dependency-type: development
    # No TypeScript release that typescript-eslint does not accept: the bound
    # is the upper bound of typescript-eslint's peer range for typescript in
    # package-lock.json (">=4.8.4 <6.1.0" today), and it moves with it —
    # test/workflows.test.ts holds the two equal, so a typescript-eslint
    # update that widens its range fails until this line follows. Proposing
    # TypeScript 7 made npm re-resolve typescript-eslint under the cooldown's
    # date limit, which cannot find the locked release when that is younger
    # than seven days: ETARGET, and the whole npm update job failed.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly # each update is a CI run, so once a month saves CI minutes
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly # each update is a CI run, so once a month saves CI minutes
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    labels: [dependencies]
  # The two pinned images of docker-compose.yml (postgis, and the build of the shell itself); the
  # released images the stack runs are pinned in images.pin, which is bumped by hand (docs/RELEASING.md).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly # each update is a CI run, so once a month saves CI minutes
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # No new PostgreSQL major for the stack's database: it runs the schema of the pinned
    # viafrei-database release, and that release and production run PostgreSQL 16 / PostGIS 3.4,
    # so a major moves with them, by hand. (postgis/postgis 18-3.6 was proposed and failed the
    # stack: the 18+ images keep their data under /var/lib/postgresql/18 and refuse a mount at
    # /var/lib/postgresql/data.) Updates within the 16 line still arrive.
    ignore:
      - dependency-name: postgis/postgis
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    labels: [dependencies]
