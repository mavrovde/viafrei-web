# Build and test on every pull request that touches more than prose (the `changes` job), and on a release's merge commit. Check names are stable: branch protection
# requires them by name (docs/RELEASING.md). viafrei-database's ci.yml, with the site's own jobs:
# the gates that judged packages/web in viafrei's Verify workflow (its static and web jobs) move
# here unchanged, except the browser checks: those run once per release, as release.yml's `web`
# job before publish (or by hand, a dispatch of release.yml on a branch), never on a pull request
# or a push, and the database jobs (migration lint, PostGIS integration) have no counterpart:
# this repository holds no schema and its runtime reads no database.
#
# Every job that runs the suite first extracts the pinned viafrei-app release (`npm run pinned`,
# images.pin): the tests read its compiled digest, ingest and mcp packages, never viafrei's source.
name: CI

on:
  # To save CI minutes: pull requests, and on main only so the release gate has a
  # run on the merge commit (scripts/ci-gate.sh reads its jobs). On main the heavy jobs run only on
  # the merge of a release pull request (its subject starts `chore: release `). No schedule, and no
  # workflow-level paths-ignore: a prose-only change is decided by the `changes` job below, so every
  # required check still reports (skipped), and no merge needs the administrator's bypass.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 26.13.0 # the Node of the image (Dockerfile); the pinned viafrei-app runs the same major

jobs:
  changes:
    name: Changes (code, or prose only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # both ends of the diff
      # scripts/changes.sh: `false` only when every changed file is prose (and no test reads it);
      # anything it cannot read is `true`. A dispatch always runs everything.
      - name: Does the change touch more than prose?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              # The BASE revision's copy judges the diff, so a pull request cannot edit the rule that
              # decides whether it is tested. The pull request's own copy is used only when the base
              # has none: the bootstrap, before changes.sh was on main.
              if git show "$PR_BASE:scripts/changes.sh" > "$RUNNER_TEMP/changes.sh" 2> /dev/null; then
                judge="$RUNNER_TEMP/changes.sh"
              else
                judge=scripts/changes.sh
                echo "::notice::changes: the base has no scripts/changes.sh (the bootstrap); the pull request's own copy judges"
              fi
              code="$(CHANGES_ROOT="$PWD" bash "$judge" "$PR_BASE" "$PR_HEAD")" ;;
            push) code="$(bash scripts/changes.sh "$BEFORE" "$AFTER")" ;;
            *) code=true ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: GHCR_READ_TOKEN must be set
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GHCR_READ_TOKEN" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::error::GHCR_READ_TOKEN is not visible to this Dependabot pull request: Dependabot runs read Dependabot secrets, not Actions secrets. Add GHCR_READ_TOKEN under Settings > Secrets and variables > Dependabot (docs/RELEASING.md)."
            else
              echo "::error::the repository secret GHCR_READ_TOKEN is not set (a pull request from a fork never sees it); the pinned viafrei-app cannot be pulled (docs/RELEASING.md)"
            fi
            exit 1
          fi
      # viafrei-app is a private package of another repository: the job pulls it with GHCR_READ_TOKEN,
      # a read:packages token kept for that one pull (docs/RELEASING.md), never with GITHUB_TOKEN.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - run: npm run pinned
      - run: npm run typecheck
      - run: npm run lint
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      # Every workflow file, with shellcheck over each run: script (both are in
      # the image). 1.7.7, pinned by digest.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -no-color

  unit:
    name: Unit tests
    needs: changes
    if: "needs.changes.outputs.code == 'true' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release '))"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: GHCR_READ_TOKEN must be set
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GHCR_READ_TOKEN" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::error::GHCR_READ_TOKEN is not visible to this Dependabot pull request: Dependabot runs read Dependabot secrets, not Actions secrets. Add GHCR_READ_TOKEN under Settings > Secrets and variables > Dependabot (docs/RELEASING.md)."
            else
              echo "::error::the repository secret GHCR_READ_TOKEN is not set (a pull request from a fork never sees it); the pinned viafrei-app cannot be pulled (docs/RELEASING.md)"
            fi
            exit 1
          fi
      # viafrei-app is a private package of another repository: the job pulls it with GHCR_READ_TOKEN,
      # a read:packages token kept for that one pull (docs/RELEASING.md), never with GITHUB_TOKEN.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - run: npm run pinned
      # The unit suite with coverage, for the SonarCloud job (no threshold: viafrei held none for the
      # site, and a new one is a decision of its own).
      - run: npm run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  gates:
    name: Site gates
    needs: changes
    if: "needs.changes.outputs.code == 'true' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release '))"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the lastmod lint reads the pull request's commits
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: GHCR_READ_TOKEN must be set
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GHCR_READ_TOKEN" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::error::GHCR_READ_TOKEN is not visible to this Dependabot pull request: Dependabot runs read Dependabot secrets, not Actions secrets. Add GHCR_READ_TOKEN under Settings > Secrets and variables > Dependabot (docs/RELEASING.md)."
            else
              echo "::error::the repository secret GHCR_READ_TOKEN is not set (a pull request from a fork never sees it); the pinned viafrei-app cannot be pulled (docs/RELEASING.md)"
            fi
            exit 1
          fi
      # viafrei-app is a private package of another repository: the job pulls it with GHCR_READ_TOKEN,
      # a read:packages token kept for that one pull (docs/RELEASING.md), never with GITHUB_TOKEN.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - run: npm run pinned
      - name: Pins (images.pin parses; pins.sh self-test)
        run: bash scripts/pins.sh lint && bash scripts/pins.test.sh
      - name: Contrast (every declared pair, both themes) and its self-test
        run: node scripts/web-contrast.mjs && bash scripts/web-contrast.test.sh
      - name: The site reads no database, the tile route is internal, and the self-test
        run: bash scripts/check_web_boundary.sh && bash scripts/check_web_boundary.test.sh
      - name: The fallback and preview pages (one sentence, no figure, legal links, nothing external) and the self-test
        run: bash scripts/check_static_pages.sh && bash scripts/check_static_pages.test.sh
      - name: The lastmod map changes only in a release commit, and is current at the cut, and the self-test
        run: |
          bash scripts/check_lastmod_commits.test.sh
          if [ "$EVENT" = pull_request ]; then bash scripts/check_lastmod_commits.sh --range "$BASE..HEAD"; fi
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
      - name: The catalogue parity sweep fails four ways (mutations, so at a dispatch or a minor's release pull request only)
        if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release-please--') && endsWith(github.event.pull_request.title, '.0'))
        run: bash scripts/web-i18n-mutation.sh

  image:
    name: Image (build, scan, smoke)
    needs: changes
    if: "needs.changes.outputs.code == 'true' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release '))"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # uploads the Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: viafrei-web:ci
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
      - name: Trivy (HIGH and CRITICAL fail)
        run: |
          mkdir -p sarif
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sarif:/out" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            --format sarif --output /out/trivy-image.sarif viafrei-web:ci
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('sarif/trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/trivy-image.sarif
          category: trivy-image
      - name: Smoke (non-root, read-only root, the static pages and route map, the GeoIP builder, /healthz, /de)
        env:
          IMAGE: viafrei-web:ci
        run: scripts/image-smoke.sh

  stack:
    name: Stack (the shell against the pinned releases)
    needs: changes
    if: "needs.changes.outputs.code == 'true' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release '))"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GHCR_READ_TOKEN must be set
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GHCR_READ_TOKEN" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::error::GHCR_READ_TOKEN is not visible to this Dependabot pull request: Dependabot runs read Dependabot secrets, not Actions secrets. Add GHCR_READ_TOKEN under Settings > Secrets and variables > Dependabot (docs/RELEASING.md)."
            else
              echo "::error::the repository secret GHCR_READ_TOKEN is not set (a pull request from a fork never sees it); the pinned viafrei-app cannot be pulled (docs/RELEASING.md)"
            fi
            exit 1
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - name: Every version tag of images.pin still names its pinned digest
        run: bash scripts/pins.sh check
      # The database migrated from empty by the pinned viafrei-database, the pinned viafrei-app's
      # digest on it, and the shell built here in front: every fragment of the home must be used.
      - name: Up, and the home renders every fragment from the pinned digest
        run: bash scripts/stack-smoke.sh
      - name: Logs
        if: failure()
        run: bash scripts/stack.sh status && bash scripts/stack.sh logs
      - name: Down
        if: always()
        run: bash scripts/stack.sh down

  sonar:
    name: SonarCloud analysis
    needs: [changes, unit]
    if: "needs.changes.outputs.code == 'true' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release '))"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SONAR_TOKEN must be set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::error::SONAR_TOKEN is not visible to this Dependabot pull request: Dependabot runs read Dependabot secrets, not Actions secrets. Add SONAR_TOKEN under Settings > Secrets and variables > Dependabot (docs/RELEASING.md)."
            else
              echo "::error::the repository secret SONAR_TOKEN is not set (a pull request from a fork never sees it); SonarCloud cannot analyse this run"
            fi
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: The coverage report is there
        run: test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
