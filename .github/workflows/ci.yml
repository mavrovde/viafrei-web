# Build and test on every pull request and on main. Check names are stable: branch protection
# requires them by name (docs/RELEASING.md). viafrei-database's ci.yml, with the site's own jobs:
# the gates that judged packages/web in viafrei's Verify workflow (its static and web jobs) move
# here unchanged, and the database jobs (migration lint, PostGIS integration) have no counterpart:
# this repository holds no schema and its runtime reads no database.
#
# Every job that runs the suite first extracts the pinned viafrei-app release (`npm run pinned`,
# images.pin): the tests read its compiled digest, ingest and mcp packages, never viafrei's source.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 26.12.1 # the Node of the image (Dockerfile), and of viafrei-app's

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pulls the pinned viafrei-app (images.pin)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # viafrei-app is a private package: this repository must be granted read access to it
      # (package settings > Manage Actions access; docs/RELEASING.md), and the job pulls it with its own token.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run pinned
      - run: npm run typecheck
      - run: npm run lint
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      # Every workflow file, with shellcheck over each run: script (both are in
      # the image). 1.7.7, pinned by digest.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -no-color

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pulls the pinned viafrei-app (images.pin)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # viafrei-app is a private package: this repository must be granted read access to it
      # (package settings > Manage Actions access; docs/RELEASING.md), and the job pulls it with its own token.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run pinned
      # The unit suite with coverage, for the SonarCloud job (no threshold: viafrei held none for the
      # site, and a new one is a decision of its own).
      - run: npm run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

  gates:
    name: Site gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pulls the pinned viafrei-app (images.pin)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # viafrei-app is a private package: this repository must be granted read access to it
      # (package settings > Manage Actions access; docs/RELEASING.md), and the job pulls it with its own token.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run pinned
      - name: Pins (images.pin parses; pins.sh self-test)
        run: bash scripts/pins.sh lint && bash scripts/pins.test.sh
      - name: Contrast (every declared pair, both themes) and its self-test
        run: node scripts/web-contrast.mjs && bash scripts/web-contrast.test.sh
      - name: The site reads no database, the tile route is internal, and the self-test
        run: bash scripts/check_web_boundary.sh && bash scripts/check_web_boundary.test.sh
      - name: The fallback and preview pages (one sentence, no figure, legal links, nothing external) and the self-test
        run: bash scripts/check_static_pages.sh && bash scripts/check_static_pages.test.sh
      - name: The catalogue parity sweep fails four ways
        run: bash scripts/web-i18n-mutation.sh

  web:
    name: Web (the site shell, built and judged)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # pulls the pinned viafrei-app (images.pin)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # viafrei-app is a private package: this repository must be granted read access to it
      # (package settings > Manage Actions access; docs/RELEASING.md), and the job pulls it with its own token.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run pinned
      # The browser is Playwright's own Chromium with its system dependencies; the version comes
      # from the lockfile, never "latest". Every step runs a declared `npm run` script, never `npx`.
      - name: Install Chromium for the browser checks
        run: npm run web:browsers
      - name: The site builds
        run: npm run web:build
      - name: Browser suite (CSP, consent, tiles, legal, routes, links, hreflang, axe in both schemes)
        run: npm run web:e2e
      - name: Page weight (raw ≤ 700 KB, gzip < 200 KB, 2 requests, no third party)
        run: npm run web:budget
      # Lighthouse at a release only (viafrei #476: Actions minutes are billed, and a commit is not
      # where the site's performance moves): on the release pull request and on a manual dispatch.
      - name: Lighthouse (perf ≥ 95, a11y 100, SEO ≥ 95, best ≥ 95, median of 3)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')
        run: npm run web:lighthouse
      - name: Latency (p95 ≤ 300 ms; slow and hanging tiles inside 2.5 s)
        run: npm run web:latency
      # The baselines are Linux renders of the Playwright container (docs/RELEASING.md); when none
      # is committed the job writes them, uploads them to be committed, and FAILS — a first run never
      # passes on screenshots it compared with nothing.
      - name: Visual — every page, DE and EN, 375/768/1280, light and dark, ≤ 0.2 % from its Linux baseline
        id: visual
        run: npm run web:visual
      - name: Visual bootstrap — write the baselines this runner renders
        if: failure() && steps.visual.outcome == 'failure' && (hashFiles('packages/web/e2e/__screenshots__/linux/**') == '' || github.event_name == 'workflow_dispatch')
        run: VISUAL_OUT_DIR="$RUNNER_TEMP/visual-baselines" npm run web:visual -- --update
      - name: Visual bootstrap — upload them to be committed
        if: failure() && steps.visual.outcome == 'failure' && (hashFiles('packages/web/e2e/__screenshots__/linux/**') == '' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-linux
          path: ${{ runner.temp }}/visual-baselines
          retention-days: 14

  image:
    name: Image (build, scan, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # uploads the Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: viafrei-web:ci
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
      - name: Trivy (HIGH and CRITICAL fail)
        run: |
          mkdir -p sarif
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sarif:/out" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            --format sarif --output /out/trivy-image.sarif viafrei-web:ci
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('sarif/trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/trivy-image.sarif
          category: trivy-image
      - name: Smoke (non-root, read-only root, the static pages and route map, the GeoIP builder, /healthz, /de)
        env:
          IMAGE: viafrei-web:ci
        run: scripts/image-smoke.sh

  stack:
    name: Stack (the shell against the pinned releases)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pulls the pinned viafrei-app (images.pin)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every version tag of images.pin still names its pinned digest
        run: bash scripts/pins.sh check
      # The database migrated from empty by the pinned viafrei-database, the pinned viafrei-app's
      # digest on it, and the shell built here in front: every fragment of the home must be used.
      - name: Up, and the home renders every fragment from the pinned digest
        run: bash scripts/stack-smoke.sh
      - name: Logs
        if: failure()
        run: bash scripts/stack.sh status && bash scripts/stack.sh logs
      - name: Down
        if: always()
        run: bash scripts/stack.sh down

  sonar:
    name: SonarCloud analysis
    needs: [unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SONAR_TOKEN must be set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::error::SONAR_TOKEN is not visible to this Dependabot pull request: Dependabot runs read Dependabot secrets, not Actions secrets. Add SONAR_TOKEN under Settings > Secrets and variables > Dependabot (docs/RELEASING.md)."
            else
              echo "::error::the repository secret SONAR_TOKEN is not set (a pull request from a fork never sees it); SonarCloud cannot analyse this run"
            fi
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: The coverage report is there
        run: test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
